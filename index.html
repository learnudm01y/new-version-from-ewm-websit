<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EWM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary': '#0D0C1D',
              'glass': 'rgba(255, 255, 255, 0.05)',
              'accent': '#7B3FE4', // Updated accent color
              'light': '#F3F4F6',
              'gray-text': '#9CA3AF',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)',
            },
            backdropBlur: {
              'xl': '20px',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: #0D0C1D;
        background-image: radial-gradient(circle at 10% 20%, rgba(123, 63, 228, 0.1) 0%, transparent S40%),
                          radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
        transition: font-family 0.3s ease-out;
      }
      section[id] {
        scroll-margin-top: 80px; /* Header height is h-20 (5rem = 80px) */
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      /* Custom scrollbar styles */
      .custom-scrollbar::-webkit-scrollbar {
        height: 12px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(123, 63, 228, 0.5); /* Semi-transparent accent color */
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(123, 63, 228, 0.8);
      }

      /* For Firefox */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(123, 63, 228, 0.5) transparent;
      }
    </style>
    
    <!-- Using Vite to serve ES modules; remove client-side Babel/importmap transpilation. -->
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-primary text-light font-sans">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
